name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: train_club
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: train_club_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U train_club -d train_club_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://train_club:ci_only@localhost:5432/train_club_test
      TEST_DATABASE_URL: postgresql://train_club:ci_only@localhost:5432/train_club_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare an isolated browser-test database
        env:
          DATABASE_URL: postgresql://train_club:ci_only@localhost:5432/train_club_e2e_test
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.TEST_DATABASE_URL });
          try {
            await client.connect();
            await client.query('CREATE DATABASE train_club_e2e_test');
          } finally {
            await client.end();
          }
          JS
          npm run db:migrate
          npm run db:seed:demo
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://train_club:ci_only@localhost:5432/train_club_e2e_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
