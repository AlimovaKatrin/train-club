<style>

*{box-sizing:border-box}body{margin:0;background:#e8ebe4;color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button,a,input,textarea,select{touch-action:manipulation}button{border:0;background:none}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8b6342;outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.app{max-width:440px;margin:auto;min-height:100svh;background:var(--bg);position:relative}.demo{padding:8px 20px;background:#e9ecdf;font-size:11px;color:#58654f;text-align:center;letter-spacing:.03em}header{display:flex;align-items:center;justify-content:space-between;padding:23px 24px 15px}.brand{display:flex;gap:9px;align-items:center;font-size:18px;font-weight:650;letter-spacing:-.6px}.brand svg{width:29px;height:29px}.edition{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}main{padding:16px 24px 132px}h1,h2,h3,p{margin:0}h1{font:44px/1.06 Georgia,"Times New Roman",serif;letter-spacing:-1.5px;font-weight:400}h2{font-size:21px;font-weight:550;letter-spacing:-.5px}h3{font-size:18px;font-weight:550;line-height:1.3}p{color:var(--muted)}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px}.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-head h2{font-size:16px;letter-spacing:0}.small{font-size:12px;color:var(--muted)}.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kind{border:1px solid var(--line);border-radius:16px;min-height:83px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:13px}.kind.active{background:var(--ink);border-color:var(--ink);color:#fffefa}.next{background:var(--sage);border-radius:var(--radius);padding:21px;margin-top:19px;position:relative;overflow:hidden}.next-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:15px}.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.58);border-radius:20px;padding:5px 10px;font-size:11px}.next h2{font:30px Georgia,serif;letter-spacing:-.7px}.next p{font-size:13px;margin-top:7px;color:#53634f}.sequence{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;gap:6px}.sequence span{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;font-size:11px;border:1px solid #a6b49d}.sequence .complete{background:#bfceb6;border-color:transparent}.sequence .current{color:white;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px #cbd8c1}.quiet{font-size:11px!important}.text-btn{font-size:13px;color:var(--accent);padding:10px 0;min-height:44px;text-decoration:underline;text-underline-offset:4px}.last{display:flex;gap:13px;align-items:center;text-align:left;width:100%;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tile-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:var(--sand)}.last strong{display:block;font-size:14px;font-weight:550}.last span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.last>.chevron{margin-left:auto;width:17px}.actionbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);padding:12px 24px calc(15px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}.primary{min-height:54px;width:100%;border-radius:16px;background:var(--accent);color:#fffefa;font-size:15px;font-weight:550;display:flex;justify-content:center;align-items:center;gap:12px}.primary svg{width:19px}.tabs{display:flex;justify-content:space-around;padding-top:8px}.tabs button{font-size:11px;min-height:43px;display:flex;gap:7px;align-items:center;color:var(--muted);padding:0 20px}.tabs svg{width:18px;height:18px}.tabs button.active{color:var(--accent);font-weight:650}.topline{display:flex;align-items:center;gap:10px;margin:-5px 0 23px;font-size:12px;color:var(--muted)}.back{width:44px;height:44px;background:#e9ecdf;border-radius:50%;display:grid;place-items:center;margin-left:-4px}.page-title{font-size:37px;line-height:1.1;margin-bottom:12px}.subtitle{font-size:14px;line-height:1.55}.form-section{margin-top:27px}.form-section>label,.field-label{display:block;font-size:14px;font-weight:550;margin-bottom:12px}.input,input[type=date],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;min-height:52px;padding:13px 14px;min-width:0}textarea{resize:vertical;min-height:94px}.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.moods button{border:1px solid var(--line);background:var(--paper);border-radius:13px;height:49px;font-size:18px}.moods button.selected{background:var(--accent);color:white;border-color:var(--accent)}.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:9px}.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}.stepper button{min-width:48px;height:52px;font-size:22px}.stepper input{width:100%;min-width:0;text-align:center;background:none;border:0;font-size:20px;padding:8px 0;appearance:textfield}.stepper input::-webkit-inner-spin-button{appearance:none}.stepper .unit{padding-right:15px;font-size:13px;color:var(--muted)}.note{display:flex;gap:10px;align-items:flex-start;padding:16px 0;font-size:12px;color:var(--muted)}.note svg{width:17px;height:17px;margin-top:1px}.error{color:#934930;font-size:13px;padding-top:10px}.progress-caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:22px 0 10px}.progress{height:4px;display:flex;gap:5px;margin-bottom:25px}.progress span{height:4px;background:#dce1d5;flex:1;border-radius:3px}.progress .done{background:var(--accent)}.exercise{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}.exercise-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.tag{font-size:11px;color:var(--accent);background:#eaf0e4;border-radius:6px;padding:4px 7px}.exercise h2{font-size:24px;line-height:1.18}.exercise .description{font-size:12px;margin:10px 0 16px}.previous{display:flex;gap:9px;background:#f0f2e9;border-radius:12px;padding:12px;font-size:12px;color:#59684e;margin:16px 0}.previous svg{width:16px;height:16px}.set-tabs{display:flex;gap:7px;margin-top:21px}.set-tabs button{flex:1;font-size:12px;min-height:44px;border-bottom:2px solid var(--line);padding:8px 3px}.set-tabs button.active{border-color:var(--accent);color:var(--accent);font-weight:650}.set-tabs button.done{color:var(--accent)}.set-kind{display:block;font-size:10px;font-weight:400;margin-top:2px}.set-tabs .warmup-tab{flex:0 0 auto;border:0;font-size:10px;padding:0 2px}.warmup-tab span{display:block;padding:5px 7px;border-radius:8px;background:var(--sand)}.warmup-tab.active span{outline:1px solid var(--accent)}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.two .stepper button{min-width:34px}.two .stepper input{font-size:22px}.two label{display:block;font-size:12px;color:var(--muted);margin:18px 0 8px}.copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;font-size:12px;color:var(--accent);margin-top:10px}.copy svg{width:16px}.set-complete{margin-top:12px;background:#e5ecdd;color:var(--ink)}.up-next{margin-top:23px}.up-next .row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:12px;align-items:center}.up-next .row>span{font-size:12px;color:var(--muted)}.up-next .row strong{font-size:13px;font-weight:500}.up-next .row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.up-next .row button{margin-left:auto;min-width:44px;height:44px}.warmup{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:16px}.warmup input{width:18px;height:18px;accent-color:var(--accent)}.time-row{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.form-section>label.time-row{display:grid;font-weight:400;margin-bottom:0}.time-row input{height:46px;min-height:46px;text-align:center}.total{display:flex;justify-content:space-between;padding:14px 0;font-size:14px;font-weight:600}.rpe{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.rpe strong{font:28px Georgia,serif}.range{width:100%;accent-color:var(--accent);height:30px}.history-filter{display:flex;gap:5px;margin:24px 0 20px}.history-filter button{font-size:12px;min-height:44px;flex:1;border-radius:11px;border:1px solid var(--line)}.history-filter .active{background:var(--ink);color:white;border-color:var(--ink)}.history-card{display:block;text-align:left;width:100%;border-bottom:1px solid var(--line);padding:20px 0}.history-card .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:11px}.history-card .entry{display:flex;align-items:center;gap:12px}.history-card h3{font-size:16px}.history-card p{font-size:12px;margin-top:5px}.history-card .entry>svg{margin-left:auto;width:16px}.empty{text-align:center;padding:50px 10px}.success{padding:35px 0 20px;text-align:center}.success .seal{margin:auto auto 27px;width:80px;height:80px;border-radius:50%;background:var(--sage);display:grid;place-items:center}.success .seal svg{width:38px;height:38px}.success h1{margin-bottom:17px}.success p{font-size:14px}.summary{margin-top:30px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}.summary .line{display:flex;justify-content:space-between;padding:12px 0;font-size:13px;border-bottom:1px solid var(--line)}.summary .line:last-child{border:0}.summary .line span{color:var(--muted)}dialog{border:0;padding:0;background:var(--bg);color:var(--ink);border-radius:28px 28px 0 0;width:min(100%,440px);max-width:none;max-height:85dvh;margin:auto auto 0;position:fixed;inset:0;box-shadow:0 -10px 60px #27352b20}dialog::backdrop{background:#26372d69;backdrop-filter:blur(3px)}.sheet{padding:12px 24px calc(28px + env(safe-area-inset-bottom))}.handle{height:4px;width:34px;border-radius:4px;background:#bdc7b8;margin:0 auto 23px}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-top button{width:44px;height:44px}.sheet>p{font-size:13px;margin-bottom:18px}.alternative{display:flex;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:17px;margin:10px 0;gap:12px}.alternative strong{font-size:14px;font-weight:550;display:block}.alternative small{font-size:12px;color:var(--muted);display:block;margin-top:5px}.alternative>svg{margin-left:auto}.toast{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);width:min(340px,85%);background:var(--ink);color:white;padding:13px 18px;border-radius:13px;font-size:13px;text-align:center;z-index:12}.hidden{display:none!important}a{color:var(--accent)}.detail-set{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.detail-set strong{display:block}.detail-set span{color:var(--muted)}
@media(min-width:600px){.app{box-shadow:0 0 70px #293c3310;min-height:100vh}.app:before{content:"Мобильный веб · дизайн-концепт";position:fixed;left:30px;bottom:30px;color:#69736b;font-size:12px;writing-mode:vertical-rl;transform:rotate(180deg)}}@media(max-width:365px){main{padding-left:18px;padding-right:18px}.exercise{padding:15px}.moods{gap:5px}.two{gap:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
<div class="demo">Дизайн-концепт · все данные демонстрационные</div>
<header><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 10v12M11 6v20M21 6v20M26 10v12M11 16h10"/></svg>train club</div><span class="edition">Личный дневник</span></header>
<main id="content"></main><div id="actions" class="actionbar"></div>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div id="sheet" class="sheet"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const icons={arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',back:'<path d="m14 6-6 6 6 6"/>',chevron:'<path d="m9 6 6 6-6 6"/>',check:'<path d="m5 12 4 4 10-10"/>',gym:'<path d="M3 9v6m4-9v12m10-12v12m4-9v6M7 12h10"/>',pilates:'<circle cx="15" cy="4" r="2"/><path d="m13 8-4 5 5 4m-5-4-5 4m8-7 5 3 4-3M3 21h18"/>',box:'<path d="M8 21v-4l-3-4V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v5l-3 4v4zm0-4h8M5 10h4v4"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v5l3 2"/>',home:'<path d="m3 10 9-7 9 7v10H3zm6 10v-7h6v7"/>',swap:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',moon:'<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.gym}</svg>`;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types=['Зал','Пилатес','Бокс'];const typeIcon=t=>({Зал:'gym',Пилатес:'pilates',Бокс:'box'}[t]);
const template=[{name:'Тяга нижнего блока',meta:'Вес на тренажёре · повторы всего',plan:'3 × 12 повторений',last:'25 кг × 12 · 3 подхода',weight:true,count:3},{name:'Сплит-присед с гантелями',meta:'Вес одной гантели · повторы на каждую ногу',plan:'3 × 10 на сторону',last:'6 кг × 10 · 3 подхода',weight:true,count:3},{name:'Планка на предплечьях',meta:'Без внешнего веса · время в секундах',plan:'3 × 30 секунд',last:'30 секунд · 3 подхода',weight:false,count:3}];
function defaultFinish(type){return {warm:type==='Зал'?'':0,main:type==='Зал'?'':60,cardio:type==='Зал'?'':0,low:100,high:180,rpe:5,notes:''}}
const state={screen:'home',type:'Зал',next:3,mood:null,sleep:8,date:'2026-11-08',index:0,set:0,exercises:[],history:[],filter:'Все',editing:null,finish:defaultFinish('Зал')};
state.history=[{id:'demo-1',type:'Пилатес',date:'2026-11-06',mood:4,sleep:8,finish:{warm:0,main:60,cardio:0,low:85,high:132,rpe:5,notes:'Спокойное занятие на реформере.'},exercises:[]},{id:'demo-2',type:'Зал',number:2,date:'2026-11-04',mood:4,sleep:8.5,finish:{warm:10,main:45,cardio:15,low:92,high:154,rpe:6,notes:''},exercises:[{...template[0],sets:[{w:25,r:12,done:true},{w:25,r:12,done:true},{w:25,r:12,done:true}]}]},{id:'demo-3',type:'Бокс',date:'2026-11-02',mood:3,sleep:8,finish:{warm:0,main:60,cardio:0,low:98,high:167,rpe:7,notes:''},exercises:[]}];
function total(f){return Number(f.warm||0)+Number(f.main||0)+Number(f.cardio||0)}
function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function breadcrumb(back,label){return `<div class="topline"><button class="back" data-go="${back}" aria-label="Назад">${icon('back')}</button>${label}</div>`}
function tabs(active){return `<nav class="tabs" aria-label="Основная навигация"><button data-go="home" class="${active==='home'?'active':''}">${icon('home')}Сегодня</button><button data-go="history" class="${active==='history'?'active':''}">${icon('history')}История</button></nav>`}
function primary(text,action,extra=''){return `<button class="primary ${extra}" data-action="${action}">${text}${icon('arrow')}</button>`}
function numeric(id,value,step=1,min=0,max=999){return `<div class="stepper"><button data-step="${id}" data-delta="-${step}" aria-label="Уменьшить">−</button><input id="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${esc(value)}" placeholder="—"><button data-step="${id}" data-delta="${step}" aria-label="Увеличить">+</button></div>`}
function render(){
 let html='',actions='';
 if(state.screen==='home'){
 html=`<div class="eyebrow">Воскресенье, 8 ноября</div><div class="section-head"><h2>Чем займёмся сегодня?</h2></div><div class="kinds">${types.map(t=>`<button class="kind ${state.type===t?'active':''}" data-type="${t}" aria-pressed="${state.type===t}">${icon(typeIcon(t))}${t}</button>`).join('')}</div><div class="next"><div class="next-top"><span>${state.type==='Зал'?'Следующая по плану':'Сегодня для себя'}</span><span class="pill">${state.type==='Зал'?'Блок из 8':'Без подходов'}</span></div><h2>${state.type==='Зал'?'Тренировка '+String(state.next).padStart(2,'0'):state.type}</h2><p>${state.type==='Зал'?'3 упражнения · пример программы':'1 час · пульс и ощущения после занятия'}</p>${state.type==='Зал'?`<div class="sequence" aria-label="Следующая тренировка ${state.next} из 8">${Array.from({length:8},(_,i)=>`<span class="${i+1<state.next?'complete':i+1===state.next?'current':''}">${i+1<state.next?'✓':i+1}</span>`).join('')}</div><p class="quiet">После восьмой — новый круг. Без спешки.</p>`:`<div class="note">${icon('info')}Очередь тренировок в зале останется прежней.</div>`}</div><div class="section"><div class="section-head"><h2>Последняя тренировка</h2><button class="text-btn" data-go="history">Вся история</button></div>${historySmall(state.history[0])}</div>`;
 actions=primary('Начать тренировку','prepare')+tabs('home');
 }else if(state.screen==='prepare'){
 html=breadcrumb('home','Перед тренировкой')+`<h1 class="page-title">Как ты сегодня?</h1><p class="subtitle">Пара деталей перед началом.<br>${state.type}${state.type==='Зал'?' · тренировка '+state.next+' из 8':''}</p><div class="form-section"><label for="date">Дата занятия</label><input id="date" type="date" value="${state.date}"></div><div class="form-section"><div class="field-label" id="mood-label">Самочувствие до тренировки</div><div class="moods" role="group" aria-labelledby="mood-label">${Array.from({length:6},(_,i)=>`<button data-mood="${i}" class="${state.mood===i?'selected':''}" aria-pressed="${state.mood===i}">${i}</button>`).join('')}</div><div class="scale-labels"><span>0 · очень плохо</span><span>5 · отлично</span></div></div><div class="form-section"><label for="sleep">Сколько часов спала?</label>${numeric('sleep',state.sleep,.5,0,24)}</div><div class="note">${icon('moon')}Можно указать половину часа<br>или ввести своё значение.</div><p class="error" id="error" role="alert"></p>`;
 actions=primary(state.type==='Зал'?'К упражнениям':'К записи занятия','begin');
 }else if(state.screen==='workout'){
 const e=state.exercises[state.index],s=currentSet();const count=state.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);const all=state.exercises.reduce((n,e)=>n+e.sets.length,0);
 html=breadcrumb('prepare',`Зал · тренировка ${state.number||state.next} из 8`)+`<h1 class="page-title">Твоя тренировка</h1><div class="progress-caption"><span>Упражнение ${state.index+1} из ${state.exercises.length}</span><span>${count} из ${all} рабочих</span></div><div class="progress">${state.exercises.map((x,i)=>`<span class="${i<=state.index?'done':''}"></span>`).join('')}</div><div class="exercise"><div class="exercise-head"><span class="tag">${e.plan}</span><span class="small">${String(state.index+1).padStart(2,'0')}</span></div><h2>${e.name}</h2><p class="description">${e.meta}</p><button class="text-btn" data-action="replace">Заменить упражнение</button><div class="previous">${icon('history')}<div>В прошлый раз<br><strong>${e.last}</strong></div></div><div class="set-tabs" role="group" aria-label="Подходы">${e.warmupSet?.done?`<button data-set="-1" class="warmup-tab ${state.set===-1?'active':''}" aria-label="Разминочный подход выполнен. Открыть"><span>✓ Разминка</span></button>`:''}${e.sets.map((x,i)=>`<button data-set="${i}" aria-label="${i+1} рабочий подход" class="${i===state.set?'active':''} ${x.done?'done':''}">${x.done?'✓ ':''}${i+1}<span class="set-kind">рабочий</span></button>`).join('')}</div><div class="${e.weight?'two':''}">${e.weight?`<div><label for="weight">Вес, кг</label>${numeric('weight',s.w,2.5)}</div>`:''}<div><label class="field-label" style="margin-top:18px;font-weight:400" for="reps">${e.weight?'Повторения':'Время, секунды'}</label>${numeric('reps',s.r,e.weight?1:5)}</div></div>${canWarmup(e)?`<label class="warmup"><input id="warmup" type="checkbox" ${s.warmup?'checked':''}>Сначала разминочный подход</label>`:state.set===-1?'<p class="small" style="margin-top:16px">Разминка не входит в рабочие подходы.</p>':''}<button class="copy" data-action="copy" ${state.set<=0?'disabled':''}>${icon('copy')}Повторить предыдущий подход</button><p id="error" class="error" role="alert"></p></div><div class="up-next"><div class="section-head"><h2>Упражнения</h2></div>${state.exercises.map((x,i)=>`<div class="row"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${x.name}</strong><small>${x.sets.filter(s=>s.done).length} / ${x.sets.length} рабочих${x.warmupSet?.done?' · разминка ✓':''}</small></div><button data-exercise="${i}" aria-label="Открыть ${x.name}">${icon('chevron')}</button></div>`).join('')}</div>`;
 actions=`<button class="primary" data-action="complete">${icon('check')}${state.set===-1?'Обновить разминку':s.warmup?'Разминка выполнена':s.done?'Обновить подход':'Подход выполнен'}</button><button class="copy" data-action="finish">${state.editing?'К итогам записи':'Завершить тренировку'} ${icon('arrow')}</button>`;
 }else if(state.screen==='finish'){
 const f=state.finish;
 html=breadcrumb(state.type==='Зал'?'workout':state.editing?'detail':'prepare','Итоги занятия')+`<h1 class="page-title">Как всё прошло?</h1><p class="subtitle">${state.type} · ${dateLabel(state.date)}<br>${state.type==='Зал'?'Запиши время и ощущения.':'Запиши пульс и ощущения.'}</p>${state.type==='Зал'?`<div class="form-section"><div class="field-label">Продолжительность, мин</div>${[['warm','Разминка'],['main','Основная часть'],['cardio','Кардио после']].map(([id,label])=>`<label class="time-row" for="${id}"><span>${label}</span><input class="input" type="number" inputmode="numeric" min="0" step="1" id="${id}" value="${f[id]}" placeholder="—"></label>`).join('')}<div class="total"><span>Всего</span><span id="total">${total(f)} мин</span></div></div>`:'<div class="summary"><div class="total"><span>Продолжительность</span><span>1 час</span></div><p class="small">Длительность занятия уже учтена.</p></div>'}<div class="form-section"><div class="field-label">Пульс с часов, уд/мин</div><div class="two"><div><label for="low">Минимальный</label><input class="input" id="low" type="number" inputmode="numeric" min="1" value="${f.low}" placeholder="—"></div><div><label for="high">Максимальный</label><input class="input" id="high" type="number" inputmode="numeric" min="1" value="${f.high}" placeholder="—"></div></div></div><div class="form-section"><div class="rpe"><label for="rpe">Тяжесть тренировки</label><strong><span id="rpe-value">${f.rpe}</span><span class="small"> / 10</span></strong></div><input class="range" type="range" min="0" max="10" id="rpe" value="${f.rpe}"><div class="scale-labels"><span>0 · совсем легко</span><span>10 · предельно тяжело</span></div></div><div class="form-section"><label for="notes">Заметка <span class="small">· по желанию</span></label><textarea id="notes" placeholder="Что хочется запомнить?">${esc(f.notes)}</textarea></div><p class="error" id="error" role="alert"></p>`;
 actions=primary(state.editing?'Сохранить изменения':'Сохранить тренировку','save');
 }else if(state.screen==='history'){
 const entries=state.history.filter(h=>state.filter==='Все'||h.type===state.filter);
 html=`<div class="eyebrow">Твой дневник</div><h1 class="page-title">Каждое занятие<br>имеет значение.</h1><div class="history-filter" role="group" aria-label="Вид тренировки">${['Все',...types].map(t=>`<button data-filter="${t}" class="${state.filter===t?'active':''}" aria-pressed="${state.filter===t}">${t}</button>`).join('')}</div><div class="section-head"><h2>Ноябрь 2026</h2><span class="small">${entries.length} занятий</span></div>${entries.map(h=>`<button class="history-card" data-entry="${h.id}"><div class="meta"><span>${dateLabel(h.date)}</span><span>${h.mood} / 5 до занятия</span></div><div class="entry"><div class="tile-icon">${icon(typeIcon(h.type))}</div><div><h3>${h.type}${h.number?' · тренировка '+h.number:''}</h3><p>${total(h.finish)} мин · тяжесть ${h.finish.rpe} / 10</p></div>${icon('chevron')}</div></button>`).join('')||'<p class="empty">Пока нет занятий этого вида.</p>'}`;
 actions=primary('Новое занятие','new')+tabs('history');
 }else if(state.screen==='detail'){
 const h=state.history.find(x=>x.id===state.detail),f=h.finish;
 html=breadcrumb('history','Запись в дневнике')+`<h1 class="page-title">${h.type}${h.number?' · '+h.number:''}</h1><p class="subtitle">${dateLabel(h.date)} · ${total(f)} минут</p><div class="summary">${[['Самочувствие до',h.mood+' / 5'],['Сон',h.sleep+' ч'],h.type==='Зал'?['Разминка / основная / кардио',`${f.warm} / ${f.main} / ${f.cardio} мин`]:['Продолжительность','1 час'],['Пульс',`${f.low||'—'}–${f.high||'—'} уд/мин`],['Тяжесть',f.rpe+' / 10']].map(([a,b])=>`<div class="line"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div>${h.exercises.map(e=>`<div class="section"><h3>${e.name}</h3><p class="small">${e.meta}</p>${[...(e.warmupSet?.done?[e.warmupSet]:[]),...e.sets].map((s,i)=>`<div class="detail-set"><strong>${s.warmup?'Разминка':(i+(e.warmupSet?.done?0:1))+' · рабочий'}</strong><span>${s.done?`${e.weight?(s.w===''?'Вес не указан':s.w+' кг')+' × ':''}${s.r} ${e.weight?'повт.':'сек.'}`:'Не записан'}</span></div>`).join('')}</div>`).join('')}${f.notes?`<div class="section"><h3>Заметка</h3><p class="subtitle" style="margin-top:10px">${esc(f.notes)}</p></div>`:''}`;
 actions=primary('Исправить запись','edit');
 }else if(state.screen==='success'){
 html=`<div class="success"><div class="seal">${icon('check')}</div><h1 class="page-title">Ещё одна<br>в твою пользу.</h1><p>Тренировка добавлена в демо-историю.<br>Спасибо, что уделила себе время.</p></div><div class="summary"><h3>${state.type} · ${dateLabel(state.date)}</h3><div class="line"><span>Всего времени</span><strong>${total(state.finish)} мин</strong></div><div class="line"><span>Тяжесть</span><strong>${state.finish.rpe} / 10</strong></div></div><div class="note">${icon('info')}${state.type==='Зал'?'Следующая в зале — тренировка '+state.next+' из 8.':'В зале по-прежнему ждёт тренировка '+state.next+' из 8.'}</div><p class="small">Это прототип: записи доступны до перезагрузки страницы.</p>`;
 actions=primary('Открыть дневник','history')+tabs('home');
 }
 $('#content').innerHTML=html;$('#actions').innerHTML=actions;
}
function historySmall(h){return `<button class="last" data-entry="${h.id}"><div class="tile-icon">${icon(typeIcon(h.type))}</div><div><strong>${h.type}${h.number?' · тренировка '+h.number:''}</strong><span>${dateLabel(h.date)} · ${total(h.finish)} минут</span></div>${icon('chevron')}</button>`}
function go(screen){$('#toast').classList.add('hidden');state.screen=screen;render();window.scrollTo(0,0)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function error(t){$('#error').textContent=t;$('#error').scrollIntoView({block:'nearest'})}
function currentSet(){const e=state.exercises[state.index];return state.set===-1?e.warmupSet:e.sets[state.set]}
function canWarmupAfterComplete(e){return state.set===0&&!e.warmupSet?.done&&!e.sets.slice(1).some(s=>s.done)}
function canWarmup(e){return state.set===0&&!e.warmupSet?.done&&!e.sets.some(s=>s.done)}
function readSet(){if(state.screen!=='workout')return;const e=state.exercises[state.index],s=currentSet();s.w=$('#weight')?.value??'';s.r=$('#reps').value;s.warmup=state.set===-1||(canWarmup(e)&&Boolean($('#warmup')?.checked))}
function readFinish(){if(state.type!=='Зал')Object.assign(state.finish,{warm:0,main:60,cardio:0});for(const k of Object.keys(state.finish))if($('#'+k))state.finish[k]=$('#'+k).value}
function showModal(title,body){$('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-top"><h2 id="modal-title">${title}</h2><button data-action="close" aria-label="Закрыть">${icon('close')}</button></div>${body}`;$('#modal').showModal()}
document.addEventListener('input',e=>{const id=e.target.id;if(state.screen==='prepare'&&id==='sleep')state.sleep=e.target.value;if(id==='date')state.date=e.target.value;if(state.screen==='finish'){readFinish();if($('#total'))$('#total').textContent=total(state.finish)+' мин';$('#rpe-value').textContent=state.finish.rpe}if(state.screen==='workout'){readSet();if(id==='warmup')render()}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go){if(state.screen==='workout'){readSet();if(id==='warmup')render()};if(state.screen==='finish')readFinish();go(b.dataset.go);return}
 if(b.dataset.type){state.type=b.dataset.type;render();return}
 if(b.dataset.mood){state.mood=Number(b.dataset.mood);state.sleep=$('#sleep').value;render();return}
 if(b.dataset.step){const el=$('#'+b.dataset.step);el.value=Math.min(Number(el.max||999),Math.max(Number(el.min||0),Math.round((Number(el.value||0)+Number(b.dataset.delta))*10)/10));el.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(b.dataset.set){readSet();state.set=Number(b.dataset.set);render();return}
 if(b.dataset.exercise){readSet();state.index=Number(b.dataset.exercise);state.set=0;render();window.scrollTo(0,0);return}
 if(b.dataset.filter){state.filter=b.dataset.filter;render();return}
 if(b.dataset.entry){state.detail=b.dataset.entry;go('detail');return}
 if(b.dataset.alt){const alt=b.dataset.alt;const old=state.exercises[state.index];state.exercises[state.index]={...old,name:alt==='dumbbell'?'Тяга гантели с упором':'Тяга в рычажном тренажёре',meta:alt==='dumbbell'?'Вес одной гантели · повторы на каждую сторону':'Вес на тренажёре · повторы всего',last:'Нет предыдущих результатов',warmupSet:null,sets:Array.from({length:3},()=>({w:'',r:'',done:false,warmup:false}))};state.set=0;$('#modal').close();render();toast('Замена только для этого занятия');return}
 const a=b.dataset.action;
 if(a==='prepare'||a==='new'){state.editing=null;state.exercises=[];state.sleep=8;state.finish=defaultFinish(state.type);go(a==='new'?'home':'prepare')}
 if(a==='begin'){state.sleep=$('#sleep').value;state.date=$('#date').value;if(!state.date||state.mood===null||state.sleep===''||Number(state.sleep)<0||Number(state.sleep)>24)return error('Укажи дату, самочувствие и сон от 0 до 24 часов.');if(!state.exercises.length){state.exercises=template.map(e=>({...e,sets:Array.from({length:e.count},()=>({w:'',r:'',done:false,warmup:false}))}));state.number=state.next;state.index=0;state.set=0}go(state.type==='Зал'?'workout':'finish')}
 if(a==='copy'){readSet();const e=state.exercises[state.index];if(state.set<=0)return;const prev=e.sets[state.set-1];e.sets[state.set]={...prev,done:false,warmup:false};render();toast('Вес и повторения скопированы')}
 if(a==='complete'){readSet();const ex=state.exercises[state.index],s=currentSet();if(s.r===''||!Number.isFinite(Number(s.r))||Number(s.r)<=0||!Number.isInteger(Number(s.r))||Number(s.w)<0)return error('Укажи целое положительное число повторений или секунд. Вес можно оставить пустым.');s.done=true;if(state.set===-1){state.set=0;render();toast('Разминка обновлена');return}if(s.warmup&&canWarmupAfterComplete(ex)){ex.warmupSet={...s,warmup:true};ex.sets[0]={w:'',r:'',done:false,warmup:false};state.set=0;render();toast('Разминка записана. Теперь первый рабочий подход');return}if(state.set<ex.sets.length-1)state.set++;else if(state.index<state.exercises.length-1){state.index++;state.set=0}render();toast('Подход отмечен')}
 if(a==='replace'){readSet();const ex=state.exercises[state.index];if(state.index!==0)return showModal('Замены упражнения','<p>Для этого примера замены пока не заданы. Здесь появятся варианты, согласованные с тренером.</p>');if(ex.warmupSet?.done||ex.sets.some(s=>s.done))return showModal('Подходы уже записаны','<p>В этом наброске замена доступна до первого выполненного подхода, чтобы не потерять результаты.</p>');showModal('Тренажёр занят?','<p>Выбери замену на это занятие.<br>Ниже — примеры, не утверждённый список тренера.</p><button class="alternative" data-alt="dumbbell"><div><strong>Тяга гантели с упором</strong><small>Свободный вес · 3 × 12 на сторону</small></div>'+icon('chevron')+'</button><button class="alternative" data-alt="machine"><div><strong>Тяга в рычажном тренажёре</strong><small>Тренажёр · 3 × 12</small></div>'+icon('chevron')+'</button><div class="note">'+icon('info')+'Вес исходного упражнения не переносится.</div>')}
 if(a==='close')$('#modal').close();
 if(a==='finish'){readSet();go('finish')}
 if(a==='save'){readFinish();const f=state.finish;if(['warm','main','cardio'].some(k=>f[k]===''||!Number.isFinite(Number(f[k]))||Number(f[k])<0||!Number.isInteger(Number(f[k])))||total(f)<=0)return error('Укажи время в целых минутах. Если разминки или кардио не было, поставь 0.');if((f.low!==''&&Number(f.low)<=0)||(f.high!==''&&Number(f.high)<=0)||(f.low!==''&&f.high!==''&&Number(f.low)>Number(f.high)))return error('Минимальный пульс не может быть больше максимального.');const h={id:state.editing||'entry-'+Date.now(),date:state.date,type:state.type,number:state.type==='Зал'?state.number:undefined,mood:state.mood,sleep:state.sleep,finish:{...f},exercises:state.type==='Зал'?structuredClone(state.exercises):[]};if(state.editing){state.history=state.history.map(x=>x.id===state.editing?h:x);state.detail=h.id;state.editing=null;go('detail');toast('Изменения сохранены в демо')}else{state.history.unshift(h);if(state.type==='Зал')state.next=state.next%8+1;go('success')}}
 if(a==='history')go('history');
 if(a==='edit'){const h=state.history.find(x=>x.id===state.detail);Object.assign(state,{editing:h.id,type:h.type,date:h.date,mood:h.mood,sleep:h.sleep,number:h.number,finish:{...h.finish},exercises:structuredClone(h.exercises),index:0,set:0});go(h.type==='Зал'?'workout':'finish')}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
render();
</script>
</body>
</html>
